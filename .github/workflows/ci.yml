name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check HTML and every local link
        run: node scripts/check-site.js

      - name: No added or changed file over 1 MB
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          limit=$((1024 * 1024))
          bad=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(stat -c %s "$f")
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::$f is $((size / 1024)) KB; files over 1 MB need a human (compress or resize it)."
              bad=1
            fi
          done < <(gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" \
                     --jq '.[] | select(.status != "removed") | .filename')
          exit "$bad"
